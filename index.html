<title>Villain Syndicate</title>
<meta name="description" content="A text RPG about building a supervillain empire: run schemes, fight rival villains, take down heroes and grow your lair.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: lair control console. A sticky HUD of meters sits over a tabbed operations board, with a dossier feed of events beside it. */
:root {
  --ground: #15101f;
  --panel: #1e172d;
  --panel-2: #291f3d;
  --line: #3a2d55;
  --ink: #efe8ff;
  --muted: #a598c2;
  --accent: #ff8a1f;
  --accent-ink: #1d0f00;
  --plot: #c46bff;
  --hp: #ff4d6a;
  --en: #ffd23f;
  --st: #4dd6ff;
  --good: #5ee0a0;
  --bad: #ff6178;
  --dots: rgba(196, 107, 255, 0.07);
  --f-display: "Bungee", Impact, "Arial Black", sans-serif;
  --f-body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--ground);
  background-image: radial-gradient(var(--dots) 1.2px, transparent 1.6px);
  background-size: 12px 12px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.4;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- Intro ---------- */
.intro { max-width: 760px; margin: 0 auto; padding: 48px 16px; display: grid; gap: 28px; }
.intro h1 { font-family: var(--f-display); font-size: clamp(2.4rem, 9vw, 4.6rem); line-height: .95; margin: 0; letter-spacing: .01em; color: var(--ink); text-wrap: balance; }
.intro h1 span { color: var(--accent); display: block; }
.intro p.lede { margin: 0; color: var(--muted); font-size: 1.15rem; max-width: 60ch; }
.field { display: grid; gap: 6px; }
.label { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.text-in { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font-size: 1.2rem; width: 100%; max-width: 420px; }
.archs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.arch { text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 6px; }
.arch[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-2); }
.arch b { font-family: var(--f-display); font-weight: 400; font-size: 1.1rem; }
.arch small { color: var(--muted); font-size: .95rem; }

/* ---------- Buttons ---------- */
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.btn:hover:not(:disabled) { filter: brightness(1.1); }
.btn:disabled { background: var(--panel-2); color: var(--muted); cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover:not(:disabled) { border-color: var(--accent); }
.btn.big { font-family: var(--f-display); font-weight: 400; font-size: 1.2rem; padding: 12px 22px; justify-self: start; }
.btn.danger { background: var(--bad); color: #1a0006; }

/* ---------- HUD ---------- */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 2px solid var(--line); }
.hud-in { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px 24px; align-items: center; }
.who { display: flex; gap: 12px; align-items: center; min-width: 0; }
.crest { width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--plot); color: var(--ground); display: grid; place-items: center; font-family: var(--f-display); font-size: 1.3rem; }
.vname { font-family: var(--f-display); font-size: 1.05rem; line-height: 1.1; overflow-wrap: anywhere; }
.vsub { color: var(--muted); font-size: .9rem; }
.xpbar { margin-top: 4px; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; width: 180px; max-width: 100%; }
.xpbar i { display: block; height: 100%; background: var(--plot); }
.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; min-width: 0; }
.meter { min-width: 0; }
.meter .top { display: flex; justify-content: space-between; gap: 6px; font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.meter .val { font-family: var(--f-mono); font-size: .95rem; color: var(--ink); letter-spacing: 0; text-transform: none; }
.meter .bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin-top: 3px; }
.meter .bar i { display: block; height: 100%; transition: width .3s; }
.meter .tm { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); margin-top: 2px; letter-spacing: 0; text-transform: none; }
.money { display: grid; gap: 2px; text-align: right; }
.money .cash { font-family: var(--f-mono); font-size: 1.25rem; font-weight: 700; color: var(--accent); }
.money .bank { font-family: var(--f-mono); font-size: .85rem; color: var(--muted); }
@media (max-width: 820px) {
  .hud-in { grid-template-columns: 1fr auto; }
  .meters { grid-column: 1 / -1; grid-row: 2; }
}

/* ---------- Tabs ---------- */
.tabs-wrap { max-width: 1200px; margin: 0 auto; padding-inline: 16px; overflow-x: auto; }
.tabs { display: flex; gap: 4px; padding-block: 12px 0; border-bottom: 1px solid var(--line); min-width: max-content; }
.tab { background: transparent; border: 0; border-bottom: 3px solid transparent; color: var(--muted); padding: 8px 12px; font-weight: 600; font-size: 1rem; letter-spacing: .03em; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }
.tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }

/* ---------- Board ---------- */
.board { max-width: 1200px; margin: 0 auto; padding: 20px 16px 80px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
@media (max-width: 900px) { .board { grid-template-columns: minmax(0, 1fr); } }
.main { display: grid; gap: 16px; min-width: 0; }
.h2 { font-family: var(--f-display); font-size: 1.5rem; margin: 0; line-height: 1.1; font-weight: 400; text-wrap: balance; }
.intro-line { color: var(--muted); margin: 0; max-width: 65ch; }
.row-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 5px 12px; font-size: .92rem; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.chip:disabled { color: var(--muted); cursor: not-allowed; }

.list { display: grid; gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; }
.card.locked { opacity: .55; }
.card .title { font-weight: 700; font-size: 1.08rem; }
.card .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: .92rem; margin-top: 2px; }
.card .meta b { color: var(--ink); font-weight: 600; }
.card .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 520px) { .card { grid-template-columns: minmax(0, 1fr); } .card .acts { justify-content: flex-start; } }
.reqs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.req { font-size: .8rem; border-radius: 4px; padding: 2px 7px; border: 1px solid var(--line); color: var(--good); }
.req.miss { color: var(--bad); border-color: var(--bad); }
.mast { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: .8rem; color: var(--muted); }
.mast .bar { flex: 1; max-width: 220px; height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.mast .bar i { display: block; height: 100%; background: var(--accent); }
.mast.done .bar i { background: var(--good); }

.e { color: var(--en); } .s { color: var(--st); } .h { color: var(--hp); } .c { color: var(--accent); } .x { color: var(--plot); }
.good { color: var(--good); } .bad { color: var(--bad); }

.stat-strip { display: flex; flex-wrap: wrap; gap: 8px 24px; background: var(--panel-2); border-radius: 8px; padding: 12px 14px; }
.stat-strip div { display: grid; }
.stat-strip span { font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.stat-strip b { font-family: var(--f-mono); font-size: 1.1rem; }

.threat { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.threat.easy { color: var(--good); } .threat.even { color: var(--en); } .threat.risky { color: var(--bad); }

.boss { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 10px; }
.boss.locked { opacity: .55; }
.boss .name { font-family: var(--f-display); font-size: 1.25rem; line-height: 1.1; }
.boss .quote { color: var(--muted); font-style: italic; margin: 0; }
.hpbar { height: 14px; background: var(--panel-2); border-radius: 4px; overflow: hidden; position: relative; }
.hpbar i { display: block; height: 100%; background: var(--hp); transition: width .25s; }
.hpbar span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-mono); font-size: .72rem; color: var(--ink); text-shadow: 0 1px 2px #000; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; }
.vault-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.vault-row .text-in { max-width: 220px; font-size: 1rem; padding: 8px 12px; font-family: var(--f-mono); }
.skill { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding-block: 8px; border-bottom: 1px solid var(--line); }
.skill:last-child { border-bottom: 0; }
.skill small { color: var(--muted); display: block; }

/* ---------- Dossier (log) ---------- */
.dossier { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 120px); max-height: 70vh; overflow: auto; }
@media (max-width: 900px) { .dossier { position: static; max-height: 360px; } }
.dossier h3 { font-family: var(--f-display); font-weight: 400; font-size: 1rem; margin: 0 0 10px; color: var(--muted); letter-spacing: .04em; }
.dossier ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.dossier li { font-size: .92rem; border-left: 2px solid var(--line); padding-left: 10px; }
.dossier li time { display: block; font-family: var(--f-mono); font-size: .7rem; color: var(--muted); }
.dossier li.win { border-left-color: var(--good); }
.dossier li.loss { border-left-color: var(--bad); }
.dossier li.lvl { border-left-color: var(--plot); }

/* ---------- Toasts ---------- */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 20; width: min(440px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: 10px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.45); animation: pop .2s ease-out; }
.toast.win { border-left-color: var(--good); } .toast.loss { border-left-color: var(--bad); } .toast.lvl { border-left-color: var(--plot); }
.toast b { font-weight: 700; }
@keyframes pop { from { transform: translateY(8px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } .meter .bar i, .hpbar i { transition: none; } }
</style>

<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
'use strict';

// ===================== Data =====================
const SAVE_KEY = 'villain-syndicate-v1';
const EN_MS = 12000, ST_MS = 30000, HP_MS = 10000, INC_MS = 60000;

const ARCHS = {

  brute:      { name: 'Brute',      blurb: 'Starts tougher and stronger. Fights pay 15% more.', en: 15, st: 7, hp: 120, atk: 3, def: 1 },
  shadow:     { name: 'Shadow',     blurb: 'Starts hard to hit. The vault charges you only 5%.', en: 15, st: 5, hp: 100, atk: 1, def: 3 },

// type: weapon | armor | vehicle. price 0 = loot only.
const ITEMS = {

  zap:      { n: 'Zap Glove', t: 'weapon', a: 4, d: 1, p: 600, l: 2 },

  jet:      { n: 'Stealth Jet', t: 'vehicle', a: 16, d: 12, p: 85000, l: 20 },
  zeppelin: { n: 'War Zeppelin', t: 'vehicle', a: 24, d: 22, p: 350000, l: 28 },
  // loot
  hook:     { n: 'Harbor Hook', t: 'weapon', a: 6, d: 2, p: 0 },
  katana:   { n: 'Neon Katana', t: 'weapon', a: 11, d: 4, p: 0 },
  seal:     { n: 'Senate Seal Plate', t: 'armor', a: 8, d: 16, p: 0 },
  olance:   { n: 'Orbital Lance', t: 'weapon', a: 26, d: 10, p: 0 },
  throne:   { n: 'Lunar Throne', t: 'vehicle', a: 40, d: 40, p: 0 },
  pshield:  { n: "Paragon's Shield", t: 'armor', a: 4, d: 10, p: 0 },
  lens:     { n: 'Lumen Lens', t: 'weapon', a: 16, d: 5, p: 0 },
  gauntlet: { n: 'Vigil Gauntlet', t: 'weapon', a: 26, d: 14, p: 0 },
  crown:    { n: 'Cosmic Crown', t: 'armor', a: 30, d: 40, p: 0 },
};

const DISTRICTS = [
  { id: 'docks', n: 'Rustwater Docks', l: 1, reward: 'hook', schemes: [
    { n: 'Shake down the dock workers', e: 1, c: [40, 80], x: 1, req: {} },
    { n: 'Smuggle cursed doubloons', e: 3, c: [120, 200], x: 3, req: { van: 1 } },
    { n: 'Hijack a cargo crane', e: 5, c: [250, 400], x: 6, req: { h: 2, shiv: 2 } },
    { n: "Flood the harbormaster's office", e: 7, c: [500, 700], x: 9, req: { h: 3, trench: 3 } },
  ]},
  { id: 'neon', n: 'Neon Row', l: 5, reward: 'katana', schemes: [
    { n: 'Rig the pachinko parlors', e: 4, c: [400, 650], x: 5, req: { zap: 2 } },
    { n: 'Hack every billboard in town', e: 6, c: [700, 1000], x: 8, req: { h: 5, hover: 1 } },
    { n: "Kidnap a pop idol's hologram", e: 9, c: [1200, 1700], x: 13, req: { kevlar: 5 } },
    { n: 'Short out the power grid', e: 12, c: [2000, 2800], x: 18, req: { h: 8, freeze: 3 } },
  ]},
  { id: 'capitol', n: 'Capitol Heights', l: 10, reward: 'seal', schemes: [
    { n: 'Blackmail a senator', e: 10, c: [3000, 4200], x: 15, req: { h: 10 } },
    { n: 'Swap the mayor with a robot', e: 14, c: [5000, 7000], x: 22, req: { exo: 5, sub: 2 } },
    { n: "Steal the city's charter", e: 18, c: [8000, 11000], x: 30, req: { plasma: 5 } },
    { n: 'Hold the stock exchange hostage', e: 24, c: [14000, 19000], x: 42, req: { h: 15, drill: 3 } },
  ]},
  { id: 'orbit', n: 'Orbital Ring', l: 18, reward: 'olance', schemes: [
    { n: 'Hijack a weather satellite', e: 20, c: [20000, 28000], x: 35, req: { nano: 8 } },
    { n: 'Sabotage the space elevator', e: 26, c: [32000, 44000], x: 48, req: { h: 20, gravity: 5 } },
    { n: 'Ransom the orbital casino', e: 32, c: [50000, 68000], x: 62, req: { jet: 5 } },
    { n: 'Nudge a comet toward Earth', e: 40, c: [80000, 110000], x: 80, req: { force: 10 } },
  ]},
  { id: 'moon', n: 'Moonbase Zero', l: 28, reward: 'throne', schemes: [
    { n: 'Strip-mine the lunar gold', e: 45, c: [130000, 170000], x: 95, req: { h: 30 } },
    { n: 'Build a laser on the dark side', e: 55, c: [200000, 260000], x: 120, req: { quantum: 10 } },
    { n: "Hold Earth's tides hostage", e: 70, c: [320000, 420000], x: 160, req: { void: 15, zeppelin: 5 } },
    { n: 'Crown yourself Emperor of Earth', e: 90, c: [600000, 800000], x: 220, req: { h: 50, doom: 10 } },
  ]},
];
DISTRICTS.forEach(d => d.schemes.forEach((s, i) => s.id = d.id + '-' + i));

const PROPS = [
  { id: 'bookie',   n: 'Back-Alley Bookie', p: 1000, inc: 15, l: 1 },
  { id: 'pawn',     n: 'Pawn Shop Front', p: 5000, inc: 70, l: 3 },
  { id: 'casino',   n: 'Underground Casino', p: 25000, inc: 320, l: 7 },
  { id: 'barracks', n: 'Henchman Barracks', p: 90000, inc: 1100, l: 12 },
  { id: 'volcano',  n: 'Volcano Lair', p: 400000, inc: 4600, l: 20 },
  { id: 'station',  n: 'Orbital Death Station', p: 2000000, inc: 22000, l: 28 },
];

const HEROES = [
  { id: 'paragon', n: 'Captain Paragon', l: 3, hp: 300, atk: 6, c: [2000, 3000], x: 40, loot: 'pshield', q: '"Truth, justice, and a very firm handshake."' },
  { id: 'lumen', n: 'Lady Lumen', l: 8, hp: 900, atk: 14, c: [9000, 12000], x: 120, loot: 'lens', q: '"Where I shine, villains scatter."' },
  { id: 'vigil', n: 'The Vigil', l: 15, hp: 2500, atk: 30, c: [40000, 52000], x: 300, loot: 'gauntlet', q: '"I never sleep. You will."' },
  { id: 'starwarden', n: 'Starwarden', l: 25, hp: 7000, atk: 60, c: [180000, 230000], x: 800, loot: 'crown', q: '"This planet is under my protection."' },
];

const RIVAL_PRE = ['Doctor', 'Baron', 'Madame', 'Professor', 'Count', 'Lord', 'Captain', 'Mister', 'Lady', 'Duchess', 'Major', ''];
const RIVAL_NAME = ['Malvolo', 'Gristle', 'Nightshade', 'Vex', 'Cinder', 'Hexley', 'Morrow', 'Quill', 'Rook', 'Sable', 'Voltaire', 'Kraken', 'Mortis', 'Blight', 'Ember', 'Static', 'Wormwood', 'Gloom', 'Saltpeter', 'Mandible'];
const RIVAL_TAG = ['runs the sewer syndicate', 'controls the toxic waste trade', 'builds doomsday clocks', 'breeds mutant eels', 'counterfeits moon rocks', 'sells cursed antiques', 'hacks traffic lights', 'trains attack pigeons', 'owns a haunted blimp', 'collects stolen statues'];

// ===================== Helpers =====================
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = n => Math.floor(n).toLocaleString('en-US');
const usd = n => '$' + num(n);
const short = n => n >= 1e6 ? '$' + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M' : n >= 1e4 ? '$' + Math.round(n / 1e3) + 'K' : usd(n);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const clock = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

// ===================== State =====================
let S = null;
let ui = { tab: 'schemes', district: 'docks', armory: 'weapon', resetArm: false, archPick: 'mastermind' };
let rivals = [];

function newGame(name, arch) {
  const A = ARCHS[arch], now = Date.now();
  return {
    v: 1, name, arch, level: 1, xp: 0, cash: arch === 'mastermind' ? 300 : 200, bank: 0,
    hp: A.hp, maxHp: A.hp, en: A.en, maxEn: A.en, st: A.st, maxSt: A.st, atk: A.atk, def: A.def, sp: 0,
    hench: 0, items: {}, props: {}, mastery: {}, districtsDone: {}, bosses: {},
    stats: { wins: 0, losses: 0, schemes: 0, heroes: 0, earned: 0 },
    t: { en: now, st: now, hp: now, inc: now, raid: now + 240000 },
    log: [],
  };
}

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const r = localStorage.getItem(SAVE_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }

function log(text, kind = '') {
  S.log.unshift({ t: Date.now(), text, kind });
  if (S.log.length > 60) S.log.length = 60;
}
function toast(html, kind = '') {
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = html;
  box.appendChild(el);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => el.remove(), 4000);
}

// ===================== Derived =====================
const xpNeed = l => Math.floor(20 + 12 * Math.pow(l, 1.45));
const crew = () => 1 + S.hench;
const owned = id => S.items[id] || 0;
const henchCost = n => Math.floor(150 * Math.pow(1.11, n));
const propCost = p => Math.floor(p.p * Math.pow(1.1, S.props[p.id] || 0));
const incomePerMin = () => PROPS.reduce((sum, p) => sum + p.inc * (S.props[p.id] || 0), 0);
const vaultFee = () => S.arch === 'shadow' ? 0.05 : 0.10;
const healCost = () => Math.ceil((S.maxHp - S.hp) * (2 + S.level * 1.5));

function gear() {
  const pool = { weapon: [], armor: [], vehicle: [] };
  for (const [id, n] of Object.entries(S.items)) {
    const it = ITEMS[id]; if (!it) continue;
    for (let i = 0; i < n; i++) pool[it.t].push(it);
  }
  let a = 0, d = 0;
  const c = crew();
  for (const list of Object.values(pool)) {
    a += [...list].sort((x, y) => y.a - x.a).slice(0, c).reduce((s, it) => s + it.a, 0);
    d += [...list].sort((x, y) => y.d - x.d).slice(0, c).reduce((s, it) => s + it.d, 0);
  }
  return { a, d };
}
function power() {
  const g = gear(), c = crew();
  return { atk: S.atk * 8 + g.a + c * 2, def: S.def * 8 + g.d + c * 2 };
}

// ===================== Time =====================
function regen(now) {
  const step = (key, maxKey, ms, amt) => {
    if (S[key] >= S[maxKey]) { S.t[key] = now; return; }
    const n = Math.floor((now - S.t[key]) / ms);
    if (n > 0) { S[key] = Math.min(S[maxKey], S[key] + n * amt); S.t[key] += n * ms; }
    if (S[key] >= S[maxKey]) S.t[key] = now;
  };
  step('en', 'maxEn', EN_MS, 1);
  step('st', 'maxSt', ST_MS, 1);
  step('hp', 'maxHp', HP_MS, Math.max(1, Math.round(S.maxHp / 60)));
}
function income(now) {
  let n = Math.floor((now - S.t.inc) / INC_MS);
  if (n <= 0) return 0;
  S.t.inc += n * INC_MS;
  n = Math.min(n, 480); // offline cap: 8 hours
  const got = incomePerMin() * n;
  if (got > 0) {
    S.cash += got; S.stats.earned += got;
    if (n > 1) log(`Your lair earned ${usd(got)} while you were away.`, 'win');
  }
  return got;
}
function raid(now) {
  if (now < S.t.raid) return;
  S.t.raid = now + rint(180, 360) * 1000;
  if (S.cash < 100 || S.level < 2 || Math.random() < 0.4) return;
  const r = makeRival();
  const me = power();
  if (r.atk > me.def) {
    const lost = Math.floor(S.cash * 0.15);
    S.cash -= lost;
    log(`${r.name} raided your lair and stole ${usd(lost)} in cash. Money in the vault is safe.`, 'loss');
    toast(`<b>${esc(r.name)}</b> raided your lair and stole <b class="c">${usd(lost)}</b>.`, 'loss');
  } else {
    log(`${r.name} tried to raid your lair. Your defenses held.`, 'win');
  }
}

// ===================== Progress =====================
function gainXp(x) {
  S.xp += x;
  while (S.xp >= xpNeed(S.level)) {
    S.xp -= xpNeed(S.level);
    S.level++;
    S.sp += 5;
    S.en = Math.max(S.en, S.maxEn); S.st = Math.max(S.st, S.maxSt); S.hp = Math.max(S.hp, S.maxHp);
    log(`Reached level ${S.level}. Energy, stamina and health refilled. +5 skill points.`, 'lvl');
    toast(`<b class="x">Level ${S.level}!</b> Meters refilled and 5 skill points to spend in Profile.`, 'lvl');
    const unlocked = DISTRICTS.find(d => d.l === S.level);
    if (unlocked) log(`New territory open: ${unlocked.n}.`, 'lvl');
    const hero = HEROES.find(h => h.l === S.level);
    if (hero) log(`${hero.n} has started patrolling your turf.`, 'lvl');
  }
}
function addItem(id, n = 1) { S.items[id] = owned(id) + n; }

function missing(req) {
  const out = [];
  for (const [k, n] of Object.entries(req)) {
    if (k === 'h') out.push({ label: `${n} henchmen`, ok: S.hench >= n });
    else out.push({ label: `${n}× ${ITEMS[k].n}`, ok: owned(k) >= n });
  }
  return out;
}

// ===================== Actions =====================
function makeRival() {
  const me = power();
  const pre = pick(RIVAL_PRE);
  const lvl = Math.max(1, S.level + rint(-2, 2));
  return {
    id: Math.random().toString(36).slice(2, 8),
    name: (pre ? pre + ' ' : '') + pick(RIVAL_NAME),
    tag: pick(RIVAL_TAG),
    level: lvl,
    crew: Math.max(1, crew() + rint(-3, 3)),
    atk: Math.round(me.def * rnd(0.55, 1.35)),
    def: Math.round(me.atk * rnd(0.55, 1.35)),
  };
}
function scout() { rivals = Array.from({ length: 6 }, makeRival); }

const act = {
  tab(t) { ui.tab = t; ui.resetArm = false; renderAll(); },
  district(id) { ui.district = id; renderMain(); },
  armory(t) { ui.armory = t; renderMain(); },

  scheme(id) {
    const d = DISTRICTS.find(d => d.schemes.some(s => s.id === id));
    const s = d.schemes.find(s => s.id === id);
    if (S.en < s.e || missing(s.req).some(r => !r.ok)) return;
    S.en -= s.e;
    let cash = rint(s.c[0], s.c[1]);
    if (S.arch === 'mastermind') cash = Math.round(cash * 1.1);
    S.cash += cash; S.stats.earned += cash; S.stats.schemes++;
    const before = S.mastery[id] || 0;
    S.mastery[id] = Math.min(100, before + 10);
    let extra = '';
    if (before < 100 && S.mastery[id] === 100) extra = ' Scheme mastered.';
    log(`${s.n}: earned ${usd(cash)} and ${s.x} XP.${extra}`, 'win');
    toast(`<b>${esc(s.n)}</b> paid <b class="c">${usd(cash)}</b> · <b class="x">+${s.x} XP</b>${extra}`, 'win');
    if (!S.districtsDone[d.id] && d.schemes.every(x => (S.mastery[x.id] || 0) >= 100)) {
      S.districtsDone[d.id] = true;
      addItem(d.reward); S.sp += 3;
      log(`You own ${d.n}. Reward: ${ITEMS[d.reward].n} and 3 skill points.`, 'lvl');
      toast(`<b>${esc(d.n)} is yours.</b> Reward: ${esc(ITEMS[d.reward].n)} and 3 skill points.`, 'lvl');
    }
    gainXp(s.x);
    commit();
  },

  fight(rid) {
    const r = rivals.find(x => x.id === rid);
    if (!r || S.st < 1) return;
    if (S.hp < 20) { toast('You are too hurt to fight. Heal in the regen tank first.', 'loss'); return; }
    S.st -= 1;
    const me = power();
    const p = clamp(me.atk ** 2 / (me.atk ** 2 + r.def ** 2), 0.05, 0.95);
    if (Math.random() < p) {
      let cash = Math.round(rint(20, 60) * r.level + rint(0, 40));
      if (S.arch === 'brute') cash = Math.round(cash * 1.15);
      const xp = clamp(rint(2, 5) + (r.level - S.level), 1, 12);
      const dmg = rint(2, 8);
      S.hp = Math.max(0, S.hp - dmg); S.cash += cash; S.stats.earned += cash; S.stats.wins++;
      log(`Beat ${r.name}: took ${usd(cash)}, +${xp} XP, lost ${dmg} health.`, 'win');
      toast(`<b class="good">You beat ${esc(r.name)}.</b> <b class="c">+${usd(cash)}</b> · <b class="x">+${xp} XP</b> · <span class="h">−${dmg} HP</span>`, 'win');
      gainXp(xp);
    } else {
      const dmg = rint(8, 18);
      const lost = Math.min(S.cash, Math.round(S.cash * 0.05));
      S.hp = Math.max(0, S.hp - dmg); S.cash -= lost; S.stats.losses++;
      log(`Lost to ${r.name}: dropped ${usd(lost)}, lost ${dmg} health.`, 'loss');
      toast(`<b class="bad">${esc(r.name)} beat you.</b> −${usd(lost)} · <span class="h">−${dmg} HP</span>`, 'loss');
    }
    commit();
  },
  scout() { scout(); renderMain(); },

  heal() {
    const c = healCost();
    if (S.hp >= S.maxHp || S.cash < c) return;
    S.cash -= c; S.hp = S.maxHp; S.t.hp = Date.now();
    log(`Spent ${usd(c)} in the regen tank. Health full.`);
    toast(`Regen tank: full health for <b class="c">${usd(c)}</b>.`);
    commit();
  },

  strike(arg) {
    const [id, times] = arg.split(':');
    const H = HEROES.find(h => h.id === id);
    const b = bossState(H);
    let n = Math.min(+times, S.st), dealt = 0, taken = 0, hits = 0;
    const me = power();
    while (n-- > 0 && S.hp >= 10 && b.hp > 0) {
      S.st--; hits++;
      const dmg = Math.round(me.atk * rnd(0.8, 1.2));
      b.hp = Math.max(0, b.hp - dmg); dealt += dmg;
      const back = Math.max(1, Math.round(H.atk * (1 + b.defeats * 0.25) * rnd(0.4, 0.8) - me.def * 0.08));
      S.hp = Math.max(0, S.hp - back); taken += back;
    }
    if (!hits) { if (S.hp < 10) toast('Too hurt to fight a hero. Heal in the regen tank first.', 'loss'); return; }
    if (b.hp <= 0) {
      const scale = 1 + b.defeats * 0.25;
      const cash = Math.round(rint(H.c[0], H.c[1]) * scale), xp = Math.round(H.x * scale);
      const drop = b.defeats === 0 || Math.random() < 0.3;
      b.defeats++; b.hp = bossMax(H, b.defeats);
      S.cash += cash; S.stats.earned += cash; S.stats.heroes++;
      if (drop) addItem(H.loot);
      log(`Defeated ${H.n}! Took ${usd(cash)}, +${xp} XP${drop ? ', and their ' + ITEMS[H.loot].n : ''}.`, 'lvl');
      toast(`<b class="x">${esc(H.n)} is defeated!</b> <b class="c">+${usd(cash)}</b> · +${xp} XP${drop ? ' · ' + esc(ITEMS[H.loot].n) : ''}`, 'lvl');
      gainXp(xp);
    } else {
      toast(`You hit <b>${esc(H.n)}</b> for <b>${num(dealt)}</b>. They hit back for <span class="h">${taken}</span>.`);
    }
    commit();
  },

  buy(arg) {
    const [id, qty] = arg.split(':'); const it = ITEMS[id]; const q = +qty;
    if (!it.p || S.level < it.l || S.cash < it.p * q) return;
    S.cash -= it.p * q; addItem(id, q);
    log(`Bought ${q}× ${it.n} for ${usd(it.p * q)}.`);
    commit();
  },
  sell(id) {
    const it = ITEMS[id]; if (!owned(id) || !it.p) return;
    S.items[id]--; const back = Math.floor(it.p / 2); S.cash += back;
    log(`Sold a ${it.n} for ${usd(back)}.`);
    commit();
  },

  hire(qty) {
    let q = +qty, total = 0;
    for (let i = 0; i < q; i++) total += henchCost(S.hench + i);
    if (S.cash < total) return;
    S.cash -= total; S.hench += q;
    log(`Hired ${q} henchm${q === 1 ? 'an' : 'en'} for ${usd(total)}. Crew is now ${crew()}.`);
    commit();
  },

  prop(id) {
    const p = PROPS.find(x => x.id === id); const c = propCost(p);
    if (S.level < p.l || S.cash < c) return;
    S.cash -= c; S.props[id] = (S.props[id] || 0) + 1;
    log(`Bought a ${p.n} for ${usd(c)}. Income is now ${usd(incomePerMin())} a minute.`);
    commit();
  },

  deposit(arg) {
    const amt = arg === 'all' ? S.cash : Math.floor(+($('#vault-amt')?.value || 0));
    if (!(amt > 0) || amt > S.cash) { toast('Enter an amount up to your cash on hand.'); return; }
    const fee = Math.ceil(amt * vaultFee());
    S.cash -= amt; S.bank += amt - fee;
    log(`Deposited ${usd(amt - fee)} in the vault (fee ${usd(fee)}).`);
    commit();
  },
  withdraw(arg) {
    const amt = arg === 'all' ? S.bank : Math.floor(+($('#vault-amt')?.value || 0));
    if (!(amt > 0) || amt > S.bank) { toast('Enter an amount up to your vault balance.'); return; }
    S.bank -= amt; S.cash += amt;
    log(`Withdrew ${usd(amt)} from the vault.`);
    commit();
  },

  skill(k) {
    const cost = k === 'maxSt' ? 2 : 1;
    if (S.sp < cost) return;
    S.sp -= cost;
    if (k === 'atk') S.atk++;
    if (k === 'def') S.def++;
    if (k === 'maxEn') { S.maxEn++; S.en++; }
    if (k === 'maxSt') { S.maxSt++; S.st++; }
    if (k === 'maxHp') { S.maxHp += 10; S.hp += 10; }
    commit();
  },

  reset() {
    if (!ui.resetArm) { ui.resetArm = true; renderMain(); return; }
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    S = null; ui.resetArm = false; ui.tab = 'schemes'; ui.district = 'docks';
    renderIntro();
  },
  cancelReset() { ui.resetArm = false; renderMain(); },

  arch(k) { ui.archPick = k; document.querySelectorAll('.arch').forEach(b => b.setAttribute('aria-pressed', b.dataset.arg === k)); },
  start() {
    const name = ($('#vname').value || '').trim().slice(0, 28) || 'Doctor Nobody';
    S = newGame(name, ui.archPick);
    log(`${name} the ${ARCHS[ui.archPick].name} has entered the underworld. Start small at the Rustwater Docks.`, 'lvl');
    scout(); commit();
  },
};

function bossMax(H, defeats) { return Math.round(H.hp * Math.pow(1.25, defeats)); }
function bossState(H) {
  if (!S.bosses[H.id]) S.bosses[H.id] = { hp: H.hp, defeats: 0 };
  return S.bosses[H.id];
}

function commit() { save(); renderAll(); }

  return `<div class="meter">

    <div><span>Crew</span><b>${crew()}</b></div>
    <div><span>Record</span><b>${S.stats.wins}–${S.stats.losses}</b></div>
    <div style="margin-left:auto;align-self:center"><button class="btn ghost" data-act="heal" ${S.hp >= S.maxHp || S.cash < hc ? 'disabled' : ''}>Regen tank${S.hp < S.maxHp ? ' · ' + usd(hc) : ''}</button></div>
  </div>
  <div class="list">${rivals.map(r => {
    const ratio = me.atk / r.def;
    const th = ratio >= 1.15 ? ['easy', 'Easy mark'] : ratio >= 0.85 ? ['even', 'Even match'] : ['risky', 'Risky'];
    return `<div class="card">
      <div>
        <div class="title">${esc(r.name)} <span class="threat ${th[0]}">${th[1]}</span></div>
        <div class="meta"><span>Lv <b class="num">${r.level}</b></span><span>Crew <b class="num">${r.crew}</b></span><span>${esc(r.tag)}</span></div>
      </div>
      <div class="acts"><button class="btn" data-act="fight" data-arg="${r.id}" ${S.st < 1 || S.hp < 20 ? 'disabled' : ''}>${S.hp < 20 ? 'Too hurt' : S.st < 1 ? 'No stamina' : 'Fight'}</button></div>
    </div>`;
  }).join('')}</div>`;
}

function viewHeroes() {
  const hc = healCost();
  return `
  <div class="row-head">
    <div><h2 class="h2">Heroes on patrol</h2>
    <p class="intro-line">Heroes take many hits to bring down. Each strike costs 1 stamina, and they hit back. Damage stays on them between visits. Every defeat makes them return stronger and richer.</p></div>
    <button class="btn ghost" data-act="heal" ${S.hp >= S.maxHp || S.cash < hc ? 'disabled' : ''}>Regen tank${S.hp < S.maxHp ? ' · ' + usd(hc) : ''}</button>
  </div>
  <div class="list">${HEROES.map(H => {
    if (S.level < H.l) return `<div class="boss locked"><div class="name">${esc(H.n)}</div><p class="quote">Appears at level ${H.l}.</p></div>`;
    const b = bossState(H), max = bossMax(H, b.defeats);
    const can = S.st >= 1 && S.hp >= 10;
    return `<div class="boss">
      <div class="row-head"><div class="name">${esc(H.n)}</div><span class="vsub">Defeated <span class="num">${b.defeats}</span>×</span></div>
      <p class="quote">${esc(H.q)}</p>
      <div class="hpbar"><i style="width:${b.hp / max * 100}%"></i><span>${num(b.hp)} / ${num(max)}</span></div>
      <div class="meta" style="display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:.92rem">
        <span>Bounty <b class="c num">${short(H.c[0] * (1 + b.defeats * .25))}+</b></span><span class="x">+${Math.round(H.x * (1 + b.defeats * .25))} XP</span><span>Drops ${esc(ITEMS[H.loot].n)}</span>
      </div>
      <div class="acts" style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn" data-act="strike" data-arg="${H.id}:1" ${can ? '' : 'disabled'}>Strike · 1 ST</button>
        <button class="btn ghost" data-act="strike" data-arg="${H.id}:5" ${S.st >= 5 && S.hp >= 10 ? '' : 'disabled'}>Strike ×5 · 5 ST</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function viewArsenal() {
  const c = crew();
  const list = Object.entries(ITEMS).filter(([id, it]) => it.t === ui.armory && (it.p || owned(id)));
  const names = { weapon: 'Weapons', armor: 'Armor', vehicle: 'Vehicles' };
  return `
  <div class="row-head">
    <div><h2 class="h2">Arsenal</h2>
    <p class="intro-line">Your crew of ${c} takes your ${c} best ${names[ui.armory].toLowerCase()} into every fight. Extras beyond that only count toward scheme requirements. Items sell back for half price.</p></div>
  </div>
  <div class="chips">${Object.entries(names).map(([k, n]) => `<button class="chip" data-act="armory" data-arg="${k}" aria-pressed="${ui.armory === k}">${n}</button>`).join('')}</div>
  <div class="list">${list.map(([id, it]) => {
    const locked = it.p && S.level < it.l;
    return `<div class="card ${locked ? 'locked' : ''}">
      <div>
        <div class="title">${esc(it.n)}${!it.p ? ' <span class="threat even">Loot</span>' : ''}</div>
        <div class="meta"><span>ATK <b class="num">${it.a}</b></span><span>DEF <b class="num">${it.d}</b></span><span>Owned <b class="num">${owned(id)}</b></span>${it.p ? `<span>${locked ? 'Unlocks at Lv ' + it.l : 'Price <b class="num">' + usd(it.p) + '</b>'}</span>` : ''}</div>
      </div>
      <div class="acts">${it.p ? `
        <button class="btn" data-act="buy" data-arg="${id}:1" ${locked || S.cash < it.p ? 'disabled' : ''}>Buy 1</button>
        <button class="btn ghost" data-act="buy" data-arg="${id}:5" ${locked || S.cash < it.p * 5 ? 'disabled' : ''}>Buy 5</button>
        <button class="btn ghost" data-act="sell" data-arg="${id}" ${owned(id) ? '' : 'disabled'}>Sell</button>` : ''}
      </div>
    </div>`;
  }).join('')}</div>`;
}

function viewCrew() {
  const one = henchCost(S.hench);
  let five = 0; for (let i = 0; i < 5; i++) five += henchCost(S.hench + i);
  return `
  <div class="row-head"><div><h2 class="h2">Henchmen</h2>
  <p class="intro-line">Every henchman carries one more weapon, armor and vehicle into battle, adds to your attack and defense, and unlocks bigger schemes. Each hire costs more than the last.</p></div></div>
  <div class="panel">
    <div class="stat-strip">
      <div><span>Henchmen</span><b>${S.hench}</b></div>
      <div><span>Crew size</span><b>${crew()}</b></div>
      <div><span>Next hire</span><b>${usd(one)}</b></div>
    </div>
    <div class="vault-row">
      <button class="btn" data-act="hire" data-arg="1" ${S.cash < one ? 'disabled' : ''}>Hire 1 · ${usd(one)}</button>
      <button class="btn ghost" data-act="hire" data-arg="5" ${S.cash < five ? 'disabled' : ''}>Hire 5 · ${usd(five)}</button>
    </div>
  </div>`;
}

function viewLair() {
  const inc = incomePerMin();
  return `
  <div class="row-head"><div><h2 class="h2">Your lair</h2>
  <p class="intro-line">Fronts and facilities pay into your cash on hand every minute, even while you're away (up to 8 hours). Each purchase raises the next price by 10%.</p></div></div>
  <div class="stat-strip">
    <div><span>Income</span><b class="c">${usd(inc)}/min</b></div>
    <div><span>Next payout</span><b>${mmss(INC_MS - (Date.now() - S.t.inc))}</b></div>
  </div>
  <div class="list">${PROPS.map(p => {
    const locked = S.level < p.l, cost = propCost(p);
    return `<div class="card ${locked ? 'locked' : ''}">
      <div><div class="title">${esc(p.n)}</div>
      <div class="meta"><span>Owned <b class="num">${S.props[p.id] || 0}</b></span><span>Pays <b class="num">${usd(p.inc)}</b>/min each</span><span>${locked ? 'Unlocks at Lv ' + p.l : 'Next costs <b class="num">' + usd(cost) + '</b>'}</span></div></div>
      <div class="acts"><button class="btn" data-act="prop" data-arg="${p.id}" ${locked || S.cash < cost ? 'disabled' : ''}>Buy</button></div>
    </div>`;
  }).join('')}</div>`;
}

function viewVault() {
  const fee = Math.round(vaultFee() * 100);
  return `
  <div class="row-head"><div><h2 class="h2">The vault</h2>
  <p class="intro-line">Rivals raid your lair every few minutes and steal 15% of the cash you carry. Money in the vault can't be stolen. Deposits cost a ${fee}% fee; withdrawals are free.</p></div></div>
  <div class="panel">
    <div class="stat-strip">
      <div><span>Cash on hand</span><b class="c">${usd(S.cash)}</b></div>
      <div><span>In the vault</span><b>${usd(S.bank)}</b></div>
    </div>
    <div class="field"><label class="label" for="vault-amt">Amount</label>
      <div class="vault-row">
        <input class="text-in" id="vault-amt" type="number" min="1" step="1" inputmode="numeric" placeholder="0">
        <button class="btn" data-act="deposit">Deposit</button>
        <button class="btn ghost" data-act="deposit" data-arg="all">Deposit all</button>
        <button class="btn ghost" data-act="withdraw">Withdraw</button>
        <button class="btn ghost" data-act="withdraw" data-arg="all">Withdraw all</button>
      </div>
    </div>
  </div>`;
}

function viewProfile() {
  const skills = [
    ['atk', 'Attack', '+1 base attack (worth 8 power)', S.atk, 1],
    ['def', 'Defense', '+1 base defense (worth 8 power)', S.def, 1],
    ['maxEn', 'Max energy', '+1 energy for schemes', S.maxEn, 1],
    ['maxSt', 'Max stamina', '+1 stamina for fights', S.maxSt, 2],
    ['maxHp', 'Max health', '+10 health', S.maxHp, 1],
  ];
  const me = power();
  return `
  <div class="row-head"><div><h2 class="h2">${esc(S.name)}</h2>
  <p class="intro-line">Level ${S.level} ${ARCHS[S.arch].name}. ${ARCHS[S.arch].blurb} You get 5 skill points per level and 3 for each district you take.</p></div></div>
  <div class="panel">
    <div class="row-head"><span class="label">Skill points</span><b class="num x" style="font-size:1.4rem">${S.sp}</b></div>
    <div>${skills.map(([k, n, d, v, cost]) => `
      <div class="skill"><div><b>${n}</b><small>${d}</small></div><span class="num">${num(v)}</span>
      <button class="btn" data-act="skill" data-arg="${k}" ${S.sp < cost ? 'disabled' : ''}>+ (${cost} SP)</button></div>`).join('')}</div>
  </div>
  <div class="stat-strip">
    <div><span>Total attack</span><b>${num(me.atk)}</b></div>
    <div><span>Total defense</span><b>${num(me.def)}</b></div>
    <div><span>Schemes run</span><b>${num(S.stats.schemes)}</b></div>
    <div><span>Fights</span><b>${S.stats.wins}–${S.stats.losses}</b></div>
    <div><span>Heroes beaten</span><b>${S.stats.heroes}</b></div>
    <div><span>Lifetime take</span><b>${short(S.stats.earned)}</b></div>
  </div>
  <div class="panel">
    <span class="label">Start over</span>
    ${ui.resetArm
      ? `<p class="intro-line">This deletes ${esc(S.name)} and all progress in this browser.</p><div class="vault-row"><button class="btn danger" data-act="reset">Delete my villain</button><button class="btn ghost" data-act="cancelReset">Keep playing</button></div>`
      : `<div><button class="btn ghost" data-act="reset">Retire this villain…</button></div>`}
  </div>`;
}

const VIEWS = { schemes: viewSchemes, fights: viewFights, heroes: viewHeroes, arsenal: viewArsenal, crew: viewCrew, lair: viewLair, vault: viewVault, profile: viewProfile };

function renderMain() {
  const el = $('#main'); if (!el) return;
  const typing = document.activeElement && el.contains(document.activeElement) && document.activeElement.tagName === 'INPUT';
  const val = typing ? document.activeElement.value : null;
  el.innerHTML = VIEWS[ui.tab]();
  if (typing) { const inp = $('#vault-amt'); if (inp) { inp.value = val; inp.focus(); } }
}
function renderLog() {
  const el = $('#log'); if (!el) return;
  el.innerHTML = S.log.slice(0, 30).map(e => `<li class="${e.kind}"><time>${clock(e.t)}</time>${esc(e.text)}</li>`).join('');
}
function renderAll() {
  if (!S) return renderIntro();
  if (!$('#hud')) {
    $('#app').innerHTML = `
      <header class="hud" id="hud"></header>
      <nav class="tabs-wrap"><div class="tabs" role="tablist" id="tabs"></div></nav>
      <div class="board">
        <main class="main" id="main"></main>
        <aside class="dossier" aria-label="Dossier"><h3>Dossier</h3><ol id="log"></ol></aside>
      </div>`;
  }
  renderHud(); renderTabs(); renderMain(); renderLog();
}

// ===================== Loop =====================
let lastSave = 0;
function tick() {
  if (!S) return;
  const now = Date.now();
  const before = { en: S.en, st: S.st, hp: S.hp };
  regen(now);
  const got = income(now);
  const cashBefore = S.cash;
  raid(now);
  renderHud();
  const changed = got > 0 || S.cash !== cashBefore || before.en !== S.en || before.st !== S.st || before.hp !== S.hp;
  if (changed) { renderMain(); renderLog(); }
  else if (ui.tab === 'lair') { const el = $('#main'); if (el) renderMain(); }
  if (changed || now - lastSave > 5000) { save(); lastSave = now; }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = act[b.dataset.act];
  if (fn) fn(b.dataset.arg);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'vname') act.start();
});

function start(data) {
  S = (data && data.S) || load();
  if (S) {
    const now = Date.now();
    regen(now); income(now);
    if (!rivals.length) scout();
  }
  try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (e) {}
  renderAll();
  setInterval(tick, 1000);
}
if (window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data ?? {});
})();
</script>
